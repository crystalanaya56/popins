<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #2b0a28 0%, #4a1a4a 50%, #3c0d38 100%);
    font-family:'Georgia', serif;
    overflow:hidden;
  }

  .stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .star { position:absolute; background:white; border-radius:50%; animation:twinkle 2s infinite; }
  @keyframes twinkle { 0%,100%{opacity:.3;transform:scale(1);} 50%{opacity:1;transform:scale(1.2);} }

  .envelope-container { position:relative; width:340px; height:240px; cursor:pointer; perspective:1000px; z-index:10; }
  .envelope-container.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px) rotate(-1deg); }
    40%{ transform:translateX(6px) rotate(1deg); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }

  .envelope {
    position:relative; width:100%; height:100%;
    background:linear-gradient(145deg,#d9509a 0%,#b32e7e 100%);
    border-radius:12px;
    box-shadow:0 20px 60px rgba(217,80,154,.5), 0 0 40px rgba(217,80,154,.3);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .envelope:hover { transform:scale(1.03); box-shadow:0 25px 70px rgba(217,80,154,.6), 0 0 60px rgba(217,80,154,.4); }

  /* Sello de cera animado */
  .seal {
    position:absolute; bottom:50%; left:50%; transform:translate(-50%,50%);
    width:60px; height:60px; z-index:15;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.35));
    animation: pulse-seal 2s infinite;
  }
  @keyframes pulse-seal { 0%,100%{ filter:drop-shadow(0 4px 10px rgba(0,0,0,.35)); } 50%{ filter:drop-shadow(0 4px 18px rgba(255,184,107,.7)); } }

  .seal-half {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(145deg,#ffb86b,#e8834a);
    border-radius:50%;
    transition: transform .6s cubic-bezier(.55,0,.55,1.2), opacity .6s ease;
  }
  .seal-half-left { clip-path: polygon(0 0, 50% 0, 50% 100%, 0% 100%); transform-origin:right center; }
  .seal-half-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); transform-origin:left center; }

  .seal-crack {
    position:absolute; top:0; left:0; width:100%; height:100%; opacity:.6;
    transition: opacity .3s ease;
  }

  .seal-flash {
    position:absolute; top:50%; left:50%; width:100%; height:100%;
    transform:translate(-50%,-50%) scale(0);
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,220,150,.6) 40%, rgba(255,255,255,0) 70%);
    opacity:0;
    pointer-events:none;
    z-index:20;
  }
  .seal-flash.active { animation: flash-burst .5s ease-out forwards; }
  @keyframes flash-burst {
    0% { opacity:0; transform:translate(-50%,-50%) scale(.3); }
    30% { opacity:1; transform:translate(-50%,-50%) scale(1.8); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(3); }
  }

  .envelope-container.open .seal-half-left { transform:translate(-16px,-10px) rotate(-30deg); opacity:0; }
  .envelope-container.open .seal-half-right { transform:translate(16px,-10px) rotate(30deg); opacity:0; }
  .envelope-container.open .seal-crack { opacity:0; }

  .envelope-flap {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(145deg,#c8408a 0%,#a32568 100%);
    clip-path:polygon(0 0, 50% 60%, 100% 0);
    transform-origin:top center;
    transition:transform .8s cubic-bezier(.68,-0.55,.265,1.55);
    z-index:10;
  }
  .envelope-container.open .envelope-flap { transform:rotateX(180deg); z-index:1; }

  /* Papel con textura */
  .letter {
    position:absolute; top:30px; left:50%; transform:translateX(-50%);
    width:305px;
    background-image:
      linear-gradient(180deg, #fffdfa 0%, #fff8fb 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
    background-blend-mode:multiply;
    border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,.2);
    padding:22px 20px;
    opacity:0;
    transition:all .6s cubic-bezier(.68,-0.55,.265,1.55) .3s;
    z-index:5;
    max-height:440px;
    overflow-y:auto;
  }
  .letter::-webkit-scrollbar { width:6px; }
  .letter::-webkit-scrollbar-track { background:#f0f0f0; border-radius:3px; }
  .letter::-webkit-scrollbar-thumb { background:linear-gradient(180deg,#d9509a,#b32e7e); border-radius:3px; }
  .envelope-container.open .letter { top:-160px; opacity:1; }

  .letter h2 { font-family:'Poppins', sans-serif; color:#b32e7e; text-align:center; margin-bottom:12px; font-size:1.3em; font-weight:700; }
  .heart-emoji { display:inline-block; animation:beat 1s infinite; }
  @keyframes beat { 0%,100%{transform:scale(1);} 25%{transform:scale(1.1);} 40%{transform:scale(1);} 60%{transform:scale(1.1);} }

  /* Galeria de fotos */
  .gallery { position:relative; width:100%; height:150px; border-radius:8px; overflow:hidden; margin-bottom:14px; box-shadow:0 4px 15px rgba(0,0,0,.18); background:#eee; }
  .gallery-track { display:flex; height:100%; transition:transform .45s ease; }
  .gallery-track img { width:100%; height:100%; object-fit:cover; flex-shrink:0; }
  .gallery-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.85); border:none; width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .gallery-prev { left:6px; } .gallery-next { right:6px; }
  .gallery-dots { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); display:flex; gap:5px; }
  .gallery-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.55); cursor:pointer; }
  .gallery-dot.active { background:#fff; }

  /* Cassette con reproductor de YouTube */
  .cassette { display:flex; align-items:center; gap:10px; background:#3a2a2a; border-radius:8px; padding:9px 10px; margin-bottom:14px; box-shadow:0 4px 12px rgba(0,0,0,.25); }
  .cassette-body { flex:1; background:#f5e6d3; border-radius:6px; padding:6px 10px; }
  .cassette-window { display:flex; justify-content:space-between; padding:0 14px; }
  .reel { width:24px; height:24px; border-radius:50%; background:radial-gradient(circle,#222 30%,#555 31%,#555 40%,#222 41%); border:2px solid #333; }
  .cassette.playing .reel { animation:spin 2s linear infinite; }
  @keyframes spin { from{transform:rotate(0);} to{transform:rotate(360deg);} }
  .cassette-label { text-align:center; font-size:.62em; color:#5a4632; margin-top:4px; font-style:italic; }
  .cassette-play { width:34px; height:34px; border-radius:50%; border:none; background:#d9509a; color:#fff; font-size:13px; cursor:pointer; flex-shrink:0; }
  .cassette-play:hover { background:#b32e7e; }

  .letter-content { color:#444; line-height:1.7; text-align:justify; font-size:.82em; min-height:60px; }
  .letter-content p { margin-bottom:12px; }
  .letter-content .firma { text-align:center; margin-top:15px; color:#b32e7e; font-style:italic; }
  .letter-content .pd { margin-top:15px; font-size:.9em; color:#555; }

  .close-btn {
    display:block; margin:20px auto 5px; padding:12px 30px;
    background:linear-gradient(145deg,#d9509a,#b32e7e); color:#fff; border:none; border-radius:25px;
    cursor:pointer; font-size:.95em; box-shadow:0 4px 20px rgba(179,46,126,.4);
    opacity:0; transition:opacity .4s ease, transform .3s ease;
  }
  .close-btn.visible { opacity:1; }
  .close-btn:hover { transform:scale(1.05); box-shadow:0 6px 30px rgba(179,46,126,.6); }

  .click-hint {
    position:absolute; bottom:-50px; left:50%; transform:translateX(-50%);
    color:#ffb86b; font-size:.85em; text-shadow:0 0 10px rgba(255,184,107,.5);
    animation:bounce 1.5s infinite; white-space:nowrap;
  }
  .envelope-container.open .click-hint { opacity:0; }
  @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(-8px);} }

  .confetti { position:fixed; top:-10px; opacity:0; pointer-events:none; z-index:100; }
  .confetti.active { animation:confetti-fall 4s ease-out forwards; }
  @keyframes confetti-fall { 0%{opacity:1; top:-10px; transform:rotate(0deg) scale(1);} 100%{opacity:0; top:100vh; transform:rotate(720deg) scale(.5);} }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="envelope-container" id="envelope" onclick="openEnvelope()">
  <div class="envelope">
    <div class="envelope-flap"></div>

    <div class="seal">
      <div class="seal-half seal-half-left"></div>
      <div class="seal-half seal-half-right"></div>
      <svg class="seal-crack" viewBox="0 0 60 60">
        <path d="M30 6 L26 20 L34 28 L27 40 L32 54" stroke="#fff8ea" stroke-width="2" fill="none"/>
      </svg>
      <div class="seal-flash" id="sealFlash"></div>
    </div>

    <div class="letter">
      <h2>Popins:</h2>

      <div class="gallery" id="gallery">
        <div class="gallery-track" id="galleryTrack">
          <img src="https://placehold.co/280x150/f5c2dc/7a2f57?text=Foto+1">
          <img src="https://placehold.co/280x150/f5c2dc/7a2f57?text=Foto+2">
          <img src="https://placehold.co/280x150/f5c2dc/7a2f57?text=Foto+3">
        </div>
        <button class="gallery-btn gallery-prev" onclick="galleryMove(event,-1)">&#8249;</button>
        <button class="gallery-btn gallery-next" onclick="galleryMove(event,1)">&#8250;</button>
        <div class="gallery-dots" id="galleryDots"></div>
      </div>

      <div class="cassette" id="cassette">
        <div class="cassette-body">
          <div class="cassette-window">
            <div class="reel" id="reelLeft"></div>
            <div class="reel" id="reelRight"></div>
          </div>
          <div class="cassette-label">Hey brother- Avicii</div>
        </div>
        <button class="cassette-play" id="cassettePlay" onclick="toggleMusic(event)">&#9658;</button>
      </div>
      <div id="yt-player-container" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;">
        <div id="yt-player"></div>
      </div>

      <div class="letter-content" id="letterContent"></div>

      <button class="close-btn" id="closeBtn" onclick="closeEnvelope(event)"></button>
    </div>
  </div>
 <div class="click-hint" id="clickHint">&#10022; dale click &#10022;</div>
</div>

<script>
  /* ======================= CONFIGURA AQUÍ ======================= */
  const CONFIG = {
    // Pon una fecha tipo '2026-08-20T00:00:00' para bloquear el sobre hasta ese día.
    // Déjalo en null para que se pueda abrir siempre.
    targetDate: null,

    // ID del video de YouTube de la canción (la parte después de "v=" en la URL).
    youtubeVideoId: 'QFuFaNsUX0c',

    // Reemplaza estas URLs por tus fotos (pueden ser links o imágenes en base64).
   photos: [
  'fotos/foto4.jpeg',
  'fotos/foto2.jpeg',
  'fotos/foto3.jpeg'
]
  };
  /* ================================================================ */

  // Estrellas
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.width = (Math.random() * 3 + 1) + 'px';
    star.style.height = star.style.width;
    star.style.animationDelay = Math.random() * 2 + 's';
    star.style.animationDuration = (Math.random() * 2 + 1) + 's';
    starsContainer.appendChild(star);
  }

  /* ---------- Galería de fotos ---------- */
  const galleryTrack = document.getElementById('galleryTrack');
  const galleryDots = document.getElementById('galleryDots');
  let galleryIndex = 0;
  let galleryTimer = null;

  function buildGallery() {
    galleryTrack.innerHTML = '';
    galleryDots.innerHTML = '';
    CONFIG.photos.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      galleryTrack.appendChild(img);
      const dot = document.createElement('div');
      dot.className = 'gallery-dot' + (i === 0 ? ' active' : '');
      dot.onclick = (e) => { e.stopPropagation(); galleryIndex = i; updateGallery(); resetGalleryTimer(); };
      galleryDots.appendChild(dot);
    });
  }

  function updateGallery() {
    galleryTrack.style.transform = `translateX(-${galleryIndex * 100}%)`;
    document.querySelectorAll('.gallery-dot').forEach((d, i) => d.classList.toggle('active', i === galleryIndex));
  }

  function galleryMove(event, dir) {
    event.stopPropagation();
    galleryIndex = (galleryIndex + dir + CONFIG.photos.length) % CONFIG.photos.length;
    updateGallery();
    resetGalleryTimer();
  }

  function resetGalleryTimer() {
    clearInterval(galleryTimer);
    galleryTimer = setInterval(() => { galleryIndex = (galleryIndex + 1) % CONFIG.photos.length; updateGallery(); }, 5000);
  }

  buildGallery();
  updateGallery();
  resetGalleryTimer();

  /* ---------- Cassette + YouTube ---------- */
  let ytPlayer;

  function loadYouTubeAPI() {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.body.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('yt-player', {
      height: '1',
      width: '1',
      videoId: CONFIG.youtubeVideoId,
      playerVars: { autoplay: 0, controls: 0 },
      events: { onStateChange: onPlayerStateChange }
    });
  };

  function onPlayerStateChange(e) {
    const cassette = document.getElementById('cassette');
    const btn = document.getElementById('cassettePlay');
    if (e.data === YT.PlayerState.PLAYING) {
      cassette.classList.add('playing');
      btn.innerHTML = '&#10074;&#10074;';
    } else {
      cassette.classList.remove('playing');
      btn.innerHTML = '&#9658;';
    }
  }

  function toggleMusic(event) {
    event.stopPropagation();
    if (!ytPlayer || !ytPlayer.getPlayerState) return;
    const state = ytPlayer.getPlayerState();
    if (state === 1) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
  }

  loadYouTubeAPI();
/* ---------- Carta (sin efecto de escritura) ---------- */
const letterParagraphs = [
  { text: "Estar lejos de ti ha sido de las cosas más difíciles de habernos venido para acá, pero también me ha hecho valorarte muchísimo más." },
  { text: "Gracias por estar siempre para mí, por cuidarme, por aguantarme incluso cuando era difícil hacerlo, por creer en mí y por ayudarme a convertirme en la persona que soy hoy. Muchas veces no te lo digo pero de verdad te admiro y te agradezco todo lo que has hecho por mí. Has sido un ejemplo en mi vida y espero que algún día pueda devolverte aunque sea un poquito de todo lo que me has dado." },
  { text: "Aunque hoy no pueda darte un abrazo, quiero que sepas que te llevo en mi corazón todos los días. Te extraño muchísimo y no te preocupes, aunque ahorita no lo parezca la vida te va a dar muchísimas más cosas bonitas porque nadie se las merece más que tú.." },
  { text: "Gracias por ser mi hermana, te amo", className: 'firma' }
];

function typeLetter(paragraphs, container) {
  paragraphs.forEach((p, index) => {
    const pEl = document.createElement('p');
    pEl.id = 'p-' + index;
    if (p.className) pEl.className = p.className;

    if (p.label) {
      const strong = document.createElement('strong');
      strong.textContent = p.label + ' ';
      pEl.appendChild(strong);
      const span = document.createElement('span');
      span.id = 'span-' + index;
      span.textContent = p.text;
      pEl.appendChild(span);
    } else {
      pEl.textContent = p.text;
    }

    container.appendChild(pEl);
  });

  document.getElementById('closeBtn').classList.add('visible');
}
 

  /* ---------- Sonido de sello al romperse ---------- */
  function playCrackSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = ctx.sampleRate * 0.18;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1200;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.9, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start();

      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
      const oscGain = ctx.createGain();
      oscGain.gain.setValueAtTime(0.4, ctx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.connect(oscGain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) {
      console.log('audio no disponible', e);
    }
  }

  /* ---------- Bloqueo por fecha ---------- */
  function isLocked() {
    if (!CONFIG.targetDate) return false;
    return new Date() < new Date(CONFIG.targetDate);
  }

  function updateHint() {
    const hint = document.getElementById('clickHint');
    if (isLocked()) {
      const diff = new Date(CONFIG.targetDate) - new Date();
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      hint.innerHTML = `&#128274; Se abre en ${d}d ${h}h ${m}m ${s}s`;
    } else {
      hint.innerHTML = '&#10022;  &#10022;';
    }
  }
  updateHint();
  setInterval(updateHint, 1000);

  /* ---------- Abrir / cerrar sobre ---------- */
  function openEnvelope() {
    const envelope = document.getElementById('envelope');
    if (isLocked()) {
      envelope.classList.add('shake');
      setTimeout(() => envelope.classList.remove('shake'), 450);
      return;
    }
    if (!envelope.classList.contains('open')) {
      envelope.classList.add('open');
      playCrackSound();
      const flash = document.getElementById('sealFlash');
      flash.classList.remove('active');
      void flash.offsetWidth;
      flash.classList.add('active');
      if (!hasTyped) {
        hasTyped = true;
        setTimeout(() => typeLetter(letterParagraphs, document.getElementById('letterContent')), 500);
      }
    }
  }

  function closeEnvelope(event) {
    event.stopPropagation();
    const envelope = document.getElementById('envelope');
    envelope.classList.remove('open');
    createConfetti();
  }

  /* ---------- Confeti ---------- */
  const confettiColors = ['#d9509a', '#ffb86b', '#e8834a', '#f57ab6', '#ff69b4', '#ffa500', '#ff6b8a', '#e84a6f', '#ffd700', '#ffffff'];
  const shapes = ['circle', 'square', 'heart'];

  function createConfetti() {
    for (let i = 0; i < 80; i++) {
      setTimeout(() => {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
        if (shape === 'heart') {
          confetti.textContent = ['💕', '💗', '✨', '🎉'][Math.floor(Math.random() * 4)];
          confetti.style.fontSize = (Math.random() * 15 + 10) + 'px';
        } else {
          confetti.style.backgroundColor = color;
          confetti.style.width = (Math.random() * 12 + 6) + 'px';
          confetti.style.height = (Math.random() * 12 + 6) + 'px';
          if (shape === 'circle') confetti.style.borderRadius = '50%';
        }
        confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.classList.add('active'), 10);
        setTimeout(() => confetti.remove(), 4500);
      }, i * 25);
    }
  }
</script>
</body>
</html>
